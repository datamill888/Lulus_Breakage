[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any. The one entry is Incorta's own design system: without the
# exemption, every @incorta/ui release would break new-app installs for 24 hours.
minimumReleaseAgeExcludes = ["@incorta/ui"]
